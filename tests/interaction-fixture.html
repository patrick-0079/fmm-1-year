<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>周年互动状态回归检查</title>
    <style>
      body { font: 16px/1.7 system-ui,sans-serif; padding: 24px; color: #493c56; background: #fff9f0; }
      li { margin: 10px 0; } .pass { color: #256b4d; } .fail { color: #b5264b; }
      #fixture { position: fixed; left: -10000px; width: 600px; }
    </style>
  </head>
  <body>
    <h1>周年互动状态回归检查</h1>
    <p>调用真实世界、活动、背包和小游戏控制器；不启动动画循环，不写入本机存档。</p>
    <p id="summary" role="status">检查中…</p><ol id="results"></ol>
    <div id="fixture">
      <button class="bag-toggle">背包</button>
      <div class="scene-wrap"><canvas id="world"></canvas>
        <div class="activity-hud" hidden><span class="activity-status"></span><button class="activity-close">收起</button><div class="activity-actions"></div></div>
        <div class="arcade-hud" hidden></div>
      </div>
      <section class="inventory-panel" hidden></section>
      <section class="reader-body" tabindex="0">可选中的信件正文</section>
    </div>
    <script type="module" src="/tests/interaction-fixture.ts"></script>
  </body>
</html>
