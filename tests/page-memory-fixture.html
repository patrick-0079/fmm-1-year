<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网页回忆阅读区验收</title>
    <style>
      html { overflow-y: scroll; }
      body { margin: 0; padding: 20px; color: #59444e; background: #f7eee5; font: 15px/1.8 system-ui,sans-serif; }
      main { width: min(100%, 960px); margin: auto; }
      #game { width: 100%; aspect-ratio: 3/2; max-height: 150px; background: #d8e4d3; }
      #game canvas { display: block; width: 100%; height: 100%; }
      .fixture-cards { display: flex; gap: 12px; margin-block: 18px; }
      .fixture-cards button,#verify { min-height: 44px; padding: 8px 16px; }
      #results { padding-inline-start: 20px; }
      #report[data-result="pass"] { color: #316c4c; }
      #report[data-result="fail"] { color: #9e3455; }
      @media(max-width:650px) { body { padding: 10px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>网页回忆阅读区验收</h1>
      <p>独立页面，不读取或写入游戏存档。检查网页阅读与游戏状态隔离、长信滚动、相册手机双列与关闭焦点。</p>
      <button id="verify">运行检查</button><p id="report" role="status">等待检查</p><ol id="results"></ol>
      <div id="game"><canvas tabindex="0" aria-label="模拟游戏，未开始"></canvas></div>
      <div class="fixture-cards"><button id="letters">晚安信箱</button><button id="album">回忆相册</button></div>
      <section class="page-memory-reader" hidden></section>
    </main>
    <script type="module" src="/tests/page-memory-fixture.ts"></script>
  </body>
</html>
