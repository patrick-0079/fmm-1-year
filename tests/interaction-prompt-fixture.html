<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>物件提示签操作验收</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 20px; background: #fff6e6; color: #655340; font: 14px/1.7 "Microsoft YaHei", system-ui, sans-serif; }
      #stage { position: relative; width: min(600px, 100%); aspect-ratio: 3 / 2; container-type: inline-size; background: #dce5c6; }
      #stage canvas { width: 100%; height: 100%; }
      .pass { color: #45664e; } .fail { color: #a83d57; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>物件旁提示签 · 点击与目标切换</h1>
    <p>使用真实提示签控件，验证按下后目标变化不会误触另一个对象。本页不读取或修改游玩存档。</p>
    <div id="stage"><canvas width="600" height="400" tabindex="0" aria-label="验收用空白地图"></canvas></div>
    <p id="summary" role="status">正在验收…</p>
    <ol id="results"></ol>
    <script type="module" src="./interaction-prompt-fixture.ts"></script>
  </body>
</html>
